name: QBIT NOVA Native CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  native-c17-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install C build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Clean build
        run: |
          make clean
          make

      - name: Run full test suite
        run: make test

      - name: Verify no Python runtime dependency
        run: |
          ./build/qnova version | grep -q 'python_dependency=false'
