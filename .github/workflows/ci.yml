name: QBIT NOVA Native CI

on:
  push:
    branches: ["main", "stage7-step9-native-tensor-memory", "stage8-step1-isolated-gpio-output"]
  pull_request:
    branches: ["main", "stage7-step9-native-tensor-memory"]

permissions:
  contents: read

jobs:
  native-c17-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev valgrind

      - name: Clean strict build
        run: |
          make clean
          make

      - name: Run full test suite
        run: make test

      - name: Verify no Python runtime dependency
        run: |
          ./build/qnova version | grep -q 'python_dependency=false'

      - name: Valgrind safe quantum run
        run: |
          valgrind --error-exitcode=99 --leak-check=full \
            ./build/qnova run examples/ghz3.qn
